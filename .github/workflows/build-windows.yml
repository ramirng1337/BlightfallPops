name: Build portable Windows overlay

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'EXE version for manual builds (e.g. v1.0.0.26)'
        required: true
        default: 'v1.0.0.26'
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Set EXE version from tag or manual input
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
        run: |
          $version = $env:RELEASE_TAG -replace '^[vV]', ''
          if ($version -notmatch '^\d+\.\d+\.\d+\.\d+$') {
            throw "Invalid version '$version'. Expected v1.0.0.26 format."
          }
          $parts = $version.Split('.')
          if (@($parts | Where-Object { [int]$_ -gt 65535 }).Count -gt 0) {
            throw 'Each version component must be between 0 and 65535.'
          }
          $versionFile = 'Blightpops-Overlay/VersionInfo.cs'
          @"
          using System.Reflection;
          [assembly: AssemblyVersion("$version")]
          [assembly: AssemblyFileVersion("$version")]
          "@ | Set-Content -LiteralPath $versionFile -Encoding UTF8
          Write-Host "Compiling EXE version $version"

      - name: Compile the standalone EXE
        working-directory: Blightpops-Overlay
        shell: cmd
        run: call "Build Once.cmd" --ci

      - name: Test lethal-hit and overkill tracking
        working-directory: Blightpops-Overlay
        shell: pwsh
        run: |
          $csc = "$env:WINDIR/Microsoft.NET/Framework/v4.0.30319/csc.exe"
          $testSource = (Resolve-Path -LiteralPath ".\Tests\TrackerTests.cs").Path
          & $csc /nologo /target:exe /codepage:65001 /main:TrackerTests /out:TrackerTests.exe /reference:System.dll /reference:System.Core.dll /reference:System.Drawing.dll /reference:System.Windows.Forms.dll /reference:System.Web.Extensions.dll /reference:System.IO.Compression.dll BlightfallPops.cs Updater.cs VersionInfo.cs $testSource
          if ($LASTEXITCODE -ne 0) { throw "Tracker test compilation failed" }
          & ./TrackerTests.exe
          if ($LASTEXITCODE -ne 0) { throw "Tracker regression tests failed" }

      - name: Test reusable cards and session reset
        working-directory: Blightpops-Overlay
        shell: pwsh
        run: |
          $csc = "$env:WINDIR/Microsoft.NET/Framework/v4.0.30319/csc.exe"
          $testSource = (Resolve-Path -LiteralPath ".\Tests\UiPerformanceTests.cs").Path
          & $csc /nologo /target:exe /codepage:65001 /main:UiPerformanceTests /out:UiPerformanceTests.exe /reference:System.dll /reference:System.Core.dll /reference:System.Drawing.dll /reference:System.Windows.Forms.dll /reference:System.Web.Extensions.dll /reference:System.IO.Compression.dll BlightfallPops.cs Updater.cs VersionInfo.cs $testSource
          if ($LASTEXITCODE -ne 0) { throw "UI test compilation failed" }
          & ./UiPerformanceTests.exe
          if ($LASTEXITCODE -ne 0) { throw "UI performance regression tests failed" }

      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = [System.Reflection.AssemblyName]::GetAssemblyName((Resolve-Path Blightpops-Overlay/BlightfallPops.exe)).Version.ToString()
          $tagVersion = '${{ github.ref_name }}' -replace '^[vV]', ''
          if ($version -ne $tagVersion) { throw "EXE version $version does not match tag $tagVersion." }

      - name: Pack the public download
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist,portable -Force | Out-Null
          Copy-Item Blightpops-Overlay/BlightfallPops.exe portable/
          Copy-Item Blightpops-Overlay/README-Portable.txt portable/README.txt
          Compress-Archive -Path portable/* -DestinationPath dist/BlightfallPops.zip -Force

      - name: Save the ready-to-run download
        uses: actions/upload-artifact@v4
        with:
          name: BlightfallPops-Windows
          path: dist/BlightfallPops.zip
          if-no-files-found: error

      - name: Publish when a version tag is pushed
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ github.ref_name }}'
          if (gh release view $tag 2>$null) {
            gh release upload $tag 'dist/BlightfallPops.zip' --clobber
          } else {
            gh release create $tag 'dist/BlightfallPops.zip' --title "Blightfall Pops $tag" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publishing failed' }
